{{- if .Values.secretReader.create }}
{{- $namespace := required "secretReader.namespace is required" .Values.secretReader.namespace }}
{{- $secretName := required "secretReader.secretName is required" .Values.secretReader.secretName }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kbbackup-prune.clusterRoleName" . }}-secret
  namespace: {{ $namespace }}
  labels:
    {{- include "kbbackup-prune.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $secretName | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kbbackup-prune.clusterRoleName" . }}-secret
  namespace: {{ $namespace }}
  labels:
    {{- include "kbbackup-prune.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kbbackup-prune.clusterRoleName" . }}-secret
subjects:
  - kind: ServiceAccount
    name: {{ include "kbbackup-prune.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
